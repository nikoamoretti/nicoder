name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    name: offline suite (lint, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -r requirements-dev.lock
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy src/local_coder
      - name: Offline tests
        run: python -m pytest tests/ -q

  container:
    name: container backend end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Build isolated worker image
        run: docker build -t local-coder-worker:1 -f docker/worker.Dockerfile docker/
      - name: End-to-end tests on the isolated backend
        run: python -m pytest tests/ -q

  package:
    name: wheel + installed CLI from an unrelated directory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel in a fresh venv
        run: |
          python -m venv /tmp/lc-venv
          /tmp/lc-venv/bin/pip install dist/*.whl
      - name: Run the installed CLI with no PYTHONPATH from /tmp
        working-directory: /tmp
        run: |
          /tmp/lc-venv/bin/local-coder --help
          /tmp/lc-venv/bin/python -c "import local_coder; print(local_coder.__version__)"
      - name: Offline fake episode through the installed entry point
        working-directory: /tmp
        run: |
          cp -r "$GITHUB_WORKSPACE/fixtures/demo_calc" /tmp/demo_calc
          /tmp/lc-venv/bin/local-coder --state-dir /tmp/lc-episodes run \
            --repo /tmp/demo_calc/repo --ticket-file /tmp/demo_calc/ticket.md \
            --profile fake:success --execution trusted-local --episode-id ci-ep
          /tmp/lc-venv/bin/local-coder --state-dir /tmp/lc-episodes inspect ci-ep
          /tmp/lc-venv/bin/local-coder --state-dir /tmp/lc-episodes diff ci-ep | grep -q "return a + b"
          /tmp/lc-venv/bin/local-coder --state-dir /tmp/lc-episodes accept ci-ep --repo /tmp/demo_calc/repo
          grep -q "return a + b" /tmp/demo_calc/repo/src/calc.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*