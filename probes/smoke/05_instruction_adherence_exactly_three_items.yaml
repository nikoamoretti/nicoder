stable_key: instruction_adherence_exactly_three_items
version: 2
category: instruction_adherence
title: "Return exactly three items and no explanatory prose"
description: >
  The model must return a JSON array containing exactly three string items and
  nothing else. Any prose, markdown, numbering, or extra/fewer items is a
  failure.
messages:
  - role: system
    content: >
      Return exactly one JSON array containing exactly three strings. Do not
      add any other text, commentary, numbering, markdown, or explanation.
      The response must be valid JSON and nothing else.
  - role: user
    content: "List the three core responsibilities of the accounts receivable team."
tools: null
request_parameters:
  temperature: 0
  max_tokens: 150
expected_behavior:
  item_count: 3
  example:
    - "issue invoices"
    - "reconcile payments"
    - "chase overdue balances"
scorers:
  - instruction_item_count_success
  - json_parse_success
  - exact_item_count
  - prohibited_explanatory_prose
  - http_success
  - error_occurrence
  - latency_measurement
importance: high
tags: [instruction_adherence, exact_count, no_prose]
