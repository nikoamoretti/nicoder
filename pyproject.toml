[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-coder"
version = "0.4.0"
description = "Local coding application for a Mac. Default engine: Local Coder apply plus local llama.cpp."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.10.6",
  "pytest==8.3.4",
]

[project.scripts]
local-coder = "local_coder.cli:main"

[project.optional-dependencies]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/local_coder"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
faulthandler_timeout = 60
