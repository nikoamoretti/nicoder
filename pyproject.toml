[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "endpoint-ledger"
version = "0.1.0"
description = "Source-linked ledger for repeatedly testing live AI model endpoints and detecting material behavior changes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "jsonschema>=4.23",
  "keyring>=25.0",
  "python-multipart>=0.0.9",
  "openai>=1.40",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "SQLAlchemy>=2.0.30",
  "typer>=0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["endpoint_ledger"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]
# The project lives inside a home-directory git repo whose .gitignore is
# not related to this codebase; always check the project's own files.
respect-gitignore = false

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  # FastAPI idiom: dependency callables in argument defaults.
  "B008",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
faulthandler_timeout = 30
